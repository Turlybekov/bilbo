name: Tests with Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы запушить отчёт в ветку gh-pages

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ВАЖНО: тут НЕТ continue-on-error.
      # Если тесты упадут, job корректно окрасится в красный,
      # а следующие шаги всё равно выполнятся благодаря if: always()
      # --alluredir не указываем явно: он уже задан в pytest.ini (addopts)
      # и указывает на reports/allure-results
      - name: Run tests
        run: pytest

      # Подтягиваем предыдущий отчёт из gh-pages, чтобы Allure
      # мог построить графики истории/трендов.
      # continue-on-error нужен на случай первого запуска,
      # когда ветки gh-pages ещё не существует.
      - name: Load previous report (for history/trends)
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Ensure gh-pages folder exists
        if: always()
        run: mkdir -p gh-pages

      # Запускаем Allure CLI непосредственно на runner, а не через Docker-action.
      # Это исключает загрузку базового образа из public.ecr.aws, которая может
      # завершаться ошибкой 429 (rate limit).
      - name: Build Allure report
        if: always()
        env:
          ALLURE_VERSION: 2.44.0
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/allure.tgz \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz"
          tar -xzf /tmp/allure.tgz -C /tmp
          export PATH="/tmp/allure-${ALLURE_VERSION}/bin:${PATH}"

          mkdir -p allure-history
          if [ -d gh-pages ]; then
            cp -a gh-pages/. allure-history/
          fi
          rm -rf allure-history/.git

          if [ -d gh-pages/last-history ]; then
            mkdir -p reports/allure-results/history
            cp -a gh-pages/last-history/. reports/allure-results/history/
          fi

          printf '{"name":"GitHub Actions","type":"github","reportName":"Allure Report with history","url":"%s","reportUrl":"%s/%s","buildUrl":"%s/%s/actions/runs/%s","buildName":"GitHub Actions Run #%s","buildOrder":"%s"}\n' \
            "$REPORT_URL" "$REPORT_URL" "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" \
            > reports/allure-results/executor.json

          allure generate --clean reports/allure-results -o allure-report
          mkdir -p "allure-history/${GITHUB_RUN_NUMBER}" allure-history/last-history
          cp -a allure-report/. "allure-history/${GITHUB_RUN_NUMBER}/"
          cp -a allure-report/history/. allure-history/last-history/

          mapfile -t reports < <(find allure-history -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -n)
          while [ "${#reports[@]}" -gt 20 ]; do
            rm -rf "allure-history/${reports[0]}"
            reports=("${reports[@]:1}")
          done

      - name: Publish report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Send Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            Статус прогона: ${{ job.status }}
            Репозиторий: ${{ github.repository }}
            Ветка/PR: ${{ github.ref_name }}
            Коммит: ${{ github.sha }}
            Отчёт (Allure): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/
